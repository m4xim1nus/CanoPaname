name: Bug
description: Quelque chose ne marche pas comme attendu dans CanoPaname.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci pour le retour. CanoPaname est une app perso maintenue par une seule personne, le triage peut prendre quelques jours.

  - type: input
    id: version
    attributes:
      label: Version de l'app
      description: Visible dans Profil → À propos, ou dans Obtainium.
      placeholder: ex. 1.0.0
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Appareil et OS
      description: Modèle + version Android (GrapheneOS, Pixel stock, etc.).
      placeholder: ex. Pixel 7 sous GrapheneOS 2026.04
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: Ce qui s'est passé
      description: Ce que tu as fait, ce que tu attendais, ce qui est arrivé à la place.
      placeholder: |
        1. J'ai ouvert l'app
        2. J'ai tapé sur un pin
        3. La fiche est restée vide
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Captures d'écran (optionnel)
      description: Glisser-déposer ici si pertinent.

  - type: checkboxes
    id: privacy
    attributes:
      label: Confidentialité
      options:
        - label: Je n'inclus aucune donnée personnelle (photos sensibles, position GPS exacte de mon domicile, etc.)
          required: true
