name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v3

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Le cache invalide quand build_dataset.py ou species-index.json change.
      # restore-keys permet à un build "froid" de partir d'un cache stale ; le
      # script skip naturellement les fichiers déjà en cache et ne re-fetch que
      # les nouveaux sk.
      - name: Cache Wikipedia dataset cache
        uses: actions/cache@v4
        with:
          path: tools/.wikipedia-cache
          key: wiki-cache-${{ hashFiles('tools/build_dataset.py', 'app/src/main/assets/species-index.json') }}
          restore-keys: |
            wiki-cache-

      - name: Decode keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > canopaname-release.jks
          test -s canopaname-release.jks

      - name: Write local.properties
        env:
          STORE_PWD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PWD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          {
            echo "RELEASE_STORE_FILE=canopaname-release.jks"
            echo "RELEASE_STORE_PASSWORD=$STORE_PWD"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PWD"
          } > local.properties

      - name: Build dataset assets
        run: |
          python3 -m pip install --user requests
          python3 tools/build_dataset.py

      - run: ./gradlew assembleRelease --stacktrace

      # Garde-fou : si les secrets ne sont pas chargés, AGP retombe sur la
      # config debug et l'APK est signé Android Debug → on bloque.
      - name: Verify signature is prod (not debug)
        run: |
          APK=$(ls app/build/outputs/apk/release/canopaname-v*-release.apk)
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then
            echo "::error::APK debug-signed, secrets non chargés"
            exit 1
          fi

      - name: Compute SHA256
        run: |
          cd app/build/outputs/apk/release
          for f in canopaname-v*-release.apk; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Cleanup secrets
        if: always()
        run: rm -f canopaname-release.jks local.properties

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/canopaname-v*-release.apk
            app/build/outputs/apk/release/canopaname-v*-release.apk.sha256
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body_path: .github/release-template.md
